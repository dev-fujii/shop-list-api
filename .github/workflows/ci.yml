name: CI

# mainへのpush・main向けのPR・画面からの手動実行で確認する。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# コードの取得に必要な読み取り権限だけを使う。
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # DB統合テスト専用。アプリやAzureの接続設定は使わない。
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shoplist_test
          POSTGRES_PASSWORD: shoplist_test_password
          POSTGRES_DB: shoplist_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shoplist_test -d shoplist_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: .NET 10 SDKを準備
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: パッケージを復元
        run: dotnet restore ShopListApi/ShopListApi.slnx

      - name: Release構成でビルド
        run: dotnet build ShopListApi/ShopListApi.slnx --configuration Release --no-restore

      - name: DBを使わないテストを実行
        run: dotnet test ShopListApi/ShopListApi.Tests/ShopListApi.Tests.csproj --configuration Release --no-build --no-restore --filter "TestCategory!=Integration"

      - name: PostgreSQLを使う統合テストを実行
        env:
          SHOPLIST_TEST_POSTGRES: "Host=localhost;Port=5432;Database=shoplist_tests;Username=shoplist_test;Password=shoplist_test_password"
        run: dotnet test ShopListApi/ShopListApi.Tests/ShopListApi.Tests.csproj --configuration Release --no-build --no-restore --filter "TestCategory=Integration"
