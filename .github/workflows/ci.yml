name: CI

# mainへのpush・main向けのPR・画面からの手動実行で確認する。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# コードの取得に必要な読み取り権限だけを使う。
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: .NET 10 SDKを準備
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: パッケージを復元
        run: dotnet restore ShopListApi/ShopListApi.slnx

      - name: Release構成でビルド
        run: dotnet build ShopListApi/ShopListApi.slnx --configuration Release --no-restore

      - name: 自動テストを実行
        run: dotnet test ShopListApi/ShopListApi.Tests/ShopListApi.Tests.csproj --configuration Release --no-build --no-restore
