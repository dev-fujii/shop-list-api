name: CI

# mainへのpush・main向けのPR・画面からの手動実行で確認する。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# コードの取得に必要な読み取り権限だけを使う。
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # DB統合テスト専用。アプリやAzureの接続設定は使わない。
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shoplist_test
          POSTGRES_PASSWORD: shoplist_test_password
          POSTGRES_DB: shoplist_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shoplist_test -d shoplist_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: .NET 10 SDKを準備
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: パッケージを復元
        run: dotnet restore ShopListApi/ShopListApi.slnx

      - name: Release構成でビルド
        run: dotnet build ShopListApi/ShopListApi.slnx --configuration Release --no-restore

      - name: DBを使わないテストを実行
        run: dotnet test ShopListApi/ShopListApi.Tests/ShopListApi.Tests.csproj --configuration Release --no-build --no-restore --filter "TestCategory!=Integration"

      - name: PostgreSQLを使う統合テストを実行
        env:
          SHOPLIST_TEST_POSTGRES: "Host=localhost;Port=5432;Database=shoplist_tests;Username=shoplist_test;Password=shoplist_test_password"
        run: dotnet test ShopListApi/ShopListApi.Tests/ShopListApi.Tests.csproj --configuration Release --no-build --no-restore --filter "TestCategory=Integration"

  # テストが全部通ったときだけ、Azure に載せるイメージを作って GHCR に置く。
  # Azure への反映（移行バンドル・新しいリビジョン）は、今までどおり手で行う。
  # DB のファイアウォールが Actions からの接続を通さないため。
  push-image:
    needs: build-and-test

    # main への push のときだけ。PR や手動実行では作らない
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    # GHCR に書き込むため、このジョブだけ packages の書き込みを許す
    permissions:
      contents: read
      packages: write

    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: GHCR にログイン
        # GitHub 以外が作ったアクションは、タグではなく commit の番号で固定する。
        # このジョブは GHCR に書き込めるので、タグを差し替えられても別の中身が動かないようにする
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # タグは commit の番号。Azure では、この番号を指定してリビジョンを作る。
      # 取得したばかりのソースから作るので、commit していない変更は入らない
      - name: イメージを作って GHCR に push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ShopListApi/ShopListApi
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
